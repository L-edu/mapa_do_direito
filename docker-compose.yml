services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://mapa:mapa@db:5432/mapa_do_direito
      JWT_SECRET: ${JWT_SECRET:-troque-em-producao}
    depends_on: [db]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mapa
      POSTGRES_PASSWORD: mapa
      POSTGRES_DB: mapa_do_direito
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
